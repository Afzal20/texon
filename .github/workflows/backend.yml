name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - database: sqlite
            database_url: ""
          - database: postgres
            database_url: postgresql://texon_test:test-only-password@127.0.0.1:5432/texon_test
    name: Backend (${{ matrix.database }})
    env:
      DATABASE_URL: ${{ matrix.database_url }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: texon_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: texon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U texon_test -d texon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install root tooling
        run: pnpm install --frozen-lockfile
      - name: Install locked backend dependencies
        run: uv sync --directory backend --frozen
      - name: Check Django configuration
        run: pnpm check:backend
      - name: Check migration drift
        run: pnpm check:migrations
      - name: Run backend regression suite
        run: pnpm test
